<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 14px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-form input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #667eea;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .actions-column {
            display: flex;
            gap: 5px;
        }

        .advanced-search-form {
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .advanced-search-form .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .advanced-search-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .advanced-search-form input[type="text"],
        .advanced-search-form input[type="number"],
        .advanced-search-form select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .advanced-search-form .actions-row {
            display: flex;
            gap: 10px;
        }

        .advanced-search-form .btn-reset {
            background-color: #6c757d;
            color: white;
        }

        .pagination {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination a, .pagination span {
            padding: 8px 12px;
            text-decoration: none;
            color: #333;
        }

        .pagination .active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination .disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .category-filters {
            margin: 20px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .category-filters label {
            font-weight: 600;
            color: #333;
            margin-right: 10px;
        }

        .btn-primary.active {
            background-color: #4a56b8;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="actions" style="justify-content: flex-start; margin-bottom: 20px;">
        <a th:href="@{/dashboard}" class="btn btn-primary">📊 Dashboard</a>
    </div>
    <h1>📦 Product Management System</h1>

    <!-- Success Message -->
    <div th:if="${message}" class="alert alert-success">
        <span th:text="${message}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <!-- Actions -->
    <div class="actions">
        <a th:href="@{/products/new}" class="btn btn-primary">➕ Add New Product</a>

        <form th:action="@{/products/search}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search products..." />
            <button type="submit" class="btn btn-primary">🔍 Search</button>
        </form>
    </div>

    <!-- Category Filter Buttons -->
    <div class="category-filters">
        <label>Filter by Category:</label>
        <a th:href="@{/products(sortBy=${sortBy},sortDir=${sortDir})}"
           th:classappend="${selectedCategory == null || selectedCategory == ''} ? 'active' : ''"
           class="btn btn-sm btn-primary">All</a>
        <a th:each="cat : ${categories}"
           th:text="${cat}"
           th:href="@{/products(category=${cat},sortBy=${sortBy},sortDir=${sortDir})}"
           th:classappend="${selectedCategory == cat} ? 'active' : ''"
           class="btn btn-sm btn-primary"></a>
    </div>


    <form th:action="@{/products/advanced-search}" method="get" class="search-form advanced-search-form"
          onchange="this.form.submit()">
        <div class="grid">
            <div>
                <label>Keyword</label>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or code..." />
            </div>

            <div>
                <label>Category</label>
                <select name="category">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == selectedCategory}">
                    </option>
                </select>
            </div>

            <div>
                <label>Min Price</label>
                <input type="number" name="minPrice" th:value="${minPrice}" placeholder="0.00" step="0.01" />
            </div>

            <div>
                <label>Max Price</label>
                <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="999999.99" step="0.01" />
            </div>
        </div>
        <div class="actions-row">
            <button type="submit" class="btn btn-primary">🔍 Search</button>
            <a th:href="@{/products}" class="btn btn-reset">🔄 Reset</a>
        </div>
    </form>

    <!-- Products Table -->
    <div th:if="${products != null and !products.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>
                    <a th:href="@{/products(sortBy='id',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        ID
                        <span th:if="${sortBy=='id'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/products(sortBy='productCode',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        Product Code
                        <span th:if="${sortBy=='productCode'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/products(sortBy='name',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        Name
                        <span th:if="${sortBy=='name'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/products(sortBy='price',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        Price
                        <span th:if="${sortBy=='price'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/products(sortBy='quantity',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        Quantity
                        <span th:if="${sortBy=='quantity'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/products(sortBy='category',sortDir=${sortDir=='asc'?'desc':'asc'},category=${selectedCategory})}">
                        Category
                        <span th:if="${sortBy=='category'}" th:text="${sortDir=='asc'?'↑':'↓'}"></span>
                    </a>
                </th>

                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.productCode}">P001</td>
                <td th:text="${product.name}">Product Name</td>
                <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$99.99</td>
                <td th:text="${product.quantity}">10</td>
                <td th:text="${product.category}">Electronics</td>
                <td>
                    <div class="actions-column">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm">✏️ Edit</a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this product?')">
                            🗑️ Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${totalPages > 1}">
            <!-- Prev -->
            <span th:if="${currentPage <= 0}" class="disabled">« Prev</span>
            <a th:if="${currentPage > 0}"
               th:href="@{/products(keyword=${keyword},category=${selectedCategory},minPrice=${minPrice},maxPrice=${maxPrice},sortBy=${sortBy},sortDir=${sortDir},page=${currentPage - 1},size=${size})}">
                « Prev
            </a>

            <!-- Page numbers -->
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:if="${i != currentPage}"
                   th:href="@{/products(keyword=${keyword},category=${selectedCategory},minPrice=${minPrice},maxPrice=${maxPrice},sortBy=${sortBy},sortDir=${sortDir},page=${i},size=${size})}"
                   th:text="${i + 1}">1</a>

                <span th:if="${i == currentPage}" class="active" th:text="${i + 1}">1</span>
            </span>

            <!-- Next -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/products(keyword=${keyword},category=${selectedCategory},minPrice=${minPrice},maxPrice=${maxPrice},sortBy=${sortBy},sortDir=${sortDir},page=${currentPage + 1},size=${size})}">
                Next »
            </a>
            <span th:if="${currentPage >= totalPages - 1}" class="disabled">Next »</span>
        </div>

    </div>

    <!-- Empty State -->
    <div th:if="${products == null or products.isEmpty()}" class="empty-state">
        <p>No products found. Add your first product!</p>
    </div>
</div>
</body>
</html>
